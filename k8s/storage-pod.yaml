apiVersion: v1
kind: Pod
metadata:
  name: day8-storage-pod
  namespace: default
  labels:
    app: day8-storage-pod
    project: kubernetes-day8
spec:
  containers:
    - name: storage-container
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do sleep 3600; done
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: day8-storage-pvc
