apiVersion: v1
kind: Pod
metadata:
  name: day8-emptydir-pod
  labels:
    project: kubernetes-day8
spec:
  containers:
    - name: storage-container
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do sleep 3600; done
      volumeMounts:
        - name: temporary-storage
          mountPath: /cache
  volumes:
    - name: temporary-storage
      emptyDir: {}
